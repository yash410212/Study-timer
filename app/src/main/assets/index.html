<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#172d27"><title>Moss & Moon</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#edf1dd;background:linear-gradient(180deg,#1c3a36,#36564b 38%,#71836a 69%,#172d27);min-height:100vh}.forest{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}.trees{position:absolute;inset:0;background:#172d27;opacity:.72;clip-path:polygon(0 30%,8% 7%,16% 34%,25% 12%,35% 39%,46% 6%,56% 34%,67% 13%,77% 37%,88% 8%,100% 33%,100% 100%,0 100%)}.glow{position:absolute;width:5px;height:5px;border-radius:50%;background:#e7e7a1;box-shadow:0 0 12px 4px #d5d99a;animation:float 4s infinite ease-in-out}.g1{left:15%;top:23%}.g2{left:80%;top:31%;animation-delay:-2s}.g3{left:62%;top:48%;animation-delay:-1s}@keyframes float{50%{transform:translateY(-12px);opacity:.35}}main{max-width:480px;margin:auto;padding:17px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;font-weight:800}.btn{border:0;border-radius:13px;padding:12px 15px;background:#ffffff1c;color:#fff;font-size:12px;font-weight:650}.hero{text-align:center;padding:29px 5px 19px}.moon{font-size:38px}.hero h1{font-size:29px;line-height:1.15;font-weight:650;margin:9px 0}.muted{font-size:12px;color:#d0dcc4}.modes{display:flex;gap:6px}.mode{flex:1;padding:11px 2px;border:1px solid #ffffff30;border-radius:12px;background:#ffffff0b;color:#e8eddf;font-size:11px}.mode.active{background:#e6e9cf;color:#284331;font-weight:800}.timer{text-align:center;padding:24px 0 17px}.digits{font-size:60px;letter-spacing:-2px;font-weight:650;font-variant-numeric:tabular-nums}.phase{font-size:10px;letter-spacing:3px;color:#d4dfc3}.actions{display:flex;justify-content:center;gap:9px;margin-top:17px}.primary{background:#e6e9cf;color:#284331;padding:14px 23px;border-radius:14px;font-weight:800}.hint{font-size:11px;color:#d1dcc8;line-height:1.6;max-width:280px;margin:14px auto 0}.panel{background:#f4f1e4;color:#354938;border-radius:17px;padding:15px;margin-top:10px}.ptitle{font-size:13px;font-weight:800;margin-bottom:11px}.row{display:flex;gap:7px}.row input{flex:1;width:60%;min-width:0;background:#fffdf5;border:1px solid #d8dfcf;border-radius:10px;padding:11px;color:#354938;font-size:12px}.add{background:#49694f;color:white;border-radius:10px;padding:0 14px}.tasks{display:grid;gap:10px;margin-top:12px;font-size:12px}.task{display:flex;align-items:center;gap:9px}.task input{accent-color:#49694f}.done{text-decoration:line-through;opacity:.55}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{border-radius:12px;padding:12px;background:#ffffff13;border:1px solid #ffffff1c}.stat b{font-size:22px;display:block}.stat small{font-size:9px;color:#d3ddc8;letter-spacing:.7px}.foot{text-align:center;padding:19px 5px;color:#d4ddc9;font-size:11px;font-style:italic}
</style></head><body><div class="forest"><div class="trees"></div><i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i></div>
<main><div class="top"><span>🌿 MOSS & MOON</span><button class="btn" id="sound">♫ Sound off</button></div><header class="hero"><div class="moon">☾</div><h1>Your little forest<br>of focus.</h1><div class="muted">Breathe in calm. Let the world slow down.</div></header>
<div class="modes"><button class="mode active" data-mode="focus">🍃 Focus</button><button class="mode" data-mode="short">☁️ Break</button><button class="mode" data-mode="long">🌙 Long rest</button></div>
<section class="timer"><div class="digits" id="digits">25:00</div><div class="phase" id="phase">READY WHEN YOU ARE</div><div class="actions"><button class="primary" id="start">▶ Begin session</button><button class="btn" id="reset">↺ Reset</button></div><div class="hint" id="hint">Find your rhythm. One small step is enough.</div></section>
<section class="panel"><div class="ptitle">✎ A thought for today</div><form class="row" id="form"><input id="taskinput" maxlength="100" placeholder="What would you like to learn?" aria-label="Study task"><button class="add">Add +</button></form><div class="tasks" id="tasks"></div></section>
<div class="stats"><div class="stat"><b id="sessions">0</b><small>SESSIONS COMPLETED</small></div><div class="stat"><b id="minutes">0 min</b><small>FOCUS MINUTES</small></div></div><div class="foot" id="foot">“Grow gently, at your own pace.” ✨</div></main>
<script>
(()=>{const $=id=>document.getElementById(id),dur={focus:1500,short:300,long:900};let mode='focus',total=1500,left=1500,running=false,deadline=0,interval=null,sessions=0,minutes=0,ctx=null,soundOn=false,birdLoop=null;let tasks=JSON.parse(localStorage.getItem('mmTasks')||'[]');sessions=+(localStorage.getItem('mmSessions')||0);minutes=+(localStorage.getItem('mmMinutes')||0);$('sessions').textContent=sessions;$('minutes').textContent=minutes+' min';const notes=[659.25,783.99,987.77,880,1046.5];function tone(f,d,v,delay=0){if(!ctx||!soundOn)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.04)}function birds(){tone(notes[Math.random()*notes.length|0],.14,.025);tone(notes[Math.random()*notes.length|0]*1.2,.12,.018,.18);if(Math.random()>.5)tone(1318,.22,.014,.36)}function chime(){tone(1046,.9,.05);tone(1318,1,.035,.18);tone(1568,1.2,.025,.38)}function sound(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();soundOn=!soundOn;$('sound').textContent=soundOn?'♫ Sound on':'♫ Sound off';if(soundOn){birds();chime();birdLoop=setInterval(birds,4700)}else{clearInterval(birdLoop)}}function render(){left=Math.max(0,left);$('digits').textContent=String(left/60|0).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('phase').textContent=running?'IN YOUR QUIET FLOW':left===0?'SESSION COMPLETE':mode==='focus'?'READY WHEN YOU ARE':'REST A LITTLE';$('start').textContent=running?'Ⅱ Pause':left===0?'↻ Again':mode==='focus'?'▶ Begin session':'▶ Start break';document.title=$('digits').textContent+' · Moss & Moon'}function stop(){running=false;clearInterval(interval)}function tick(){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left){stop();if(mode==='focus'){sessions++;minutes+=total/60|0;localStorage.setItem('mmSessions',sessions);localStorage.setItem('mmMinutes',minutes);$('sessions').textContent=sessions;$('minutes').textContent=minutes+' min';$('hint').textContent='Beautiful work. Take a little rest.';$('foot').textContent='“Every small step helps you grow.” ✨'}else $('hint').textContent='Rest complete. Return when you feel ready.';if(soundOn)chime()}render()}function select(m){stop();mode=m;left=total=dur[m];document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('hint').textContent=m==='focus'?'Find your rhythm. One small step is enough.':'Rest your eyes, stretch, and listen to the quiet.';render()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>select(b.dataset.mode));$('sound').onclick=sound;$('start').onclick=()=>{if(running){stop();render();return}if(left<=0)left=total;running=true;deadline=Date.now()+left*1000;tick();interval=setInterval(tick,250)};$('reset').onclick=()=>{stop();left=total=dur[mode];render()};function drawTasks(){let box=$('tasks');box.innerHTML='';if(!tasks.length){box.innerHTML='<div style="opacity:.65;font-size:11px">A fresh page, just for you. 🌱</div>';return}tasks.forEach((t,i)=>{let l=document.createElement('label');l.className='task';let c=document.createElement('input');c.type='checkbox';c.checked=t.done;let s=document.createElement('span');s.textContent=t.text;s.className=t.done?'done':'';c.onchange=()=>{tasks[i].done=c.checked;localStorage.setItem('mmTasks',JSON.stringify(tasks));drawTasks()};l.append(c,s);box.append(l)})}$('form').onsubmit=e=>{e.preventDefault();let input=$('taskinput'),v=input.value.trim();if(!v)return;tasks.push({text:v,done:false});localStorage.setItem('mmTasks',JSON.stringify(tasks));input.value='';drawTasks()};drawTasks();render()})();
</script></body></html>
